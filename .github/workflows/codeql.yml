name: CodeQL

on:
  push:
    branches: [Develop, master]
  pull_request:
    branches: [Develop, master]
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    name: Análisis CodeQL (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Compilar la API
        run: dotnet build PodoFlow.Api/PodoFlow.Api.csproj --configuration Release

      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
